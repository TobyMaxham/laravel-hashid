name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test src/ tests/

  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: gmp, bcmath, pdo_sqlite
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Require Laravel ${{ matrix.laravel }}
        run: composer require --no-update --dev "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --compact

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --coverage --min=90
